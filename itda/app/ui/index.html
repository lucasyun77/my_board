<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>잇다</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- ① 왼쪽: 프로젝트 → 컴퓨터·사람 → 세션 -->
  <aside id="side">
    <div class="brand">
      <svg viewBox="0 0 40 40" width="24" height="24" aria-hidden="true"><path d="M8 26 C14 10, 26 10, 32 26" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="4 3" stroke-linecap="round"/><circle cx="8" cy="26" r="4.5" fill="var(--ink)"/><circle cx="20" cy="14" r="4.5" fill="var(--accent)"/><circle cx="32" cy="26" r="4.5" fill="var(--ink)"/></svg>
      <b>잇다</b><span>세션을 잇는 팀</span>
    </div>
    <button class="btn wide" id="btnNewProject"><svg class="i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg>새 프로젝트</button>
    <div id="tree"></div>
    <div class="me" id="meBox"></div>
  </aside>

  <!-- ② 가운데: 세션 창 -->
  <main id="center">
    <header id="sessHead"></header>
    <div id="log" class="log"></div>
    <div id="coachStrip"></div>
    <form id="inputBar" autocomplete="off">
      <div class="hint" id="inputHint"></div>
      <div class="row">
        <textarea id="input" rows="2" placeholder="메시지 또는 명령"></textarea>
        <button class="btn primary" type="submit">보내기</button>
      </div>
    </form>
  </main>

  <div id="splitter" title="끌어서 넓이 조절"></div>

  <!-- ③ 오른쪽: 아티팩트 공간 -->
  <section id="right">
    <nav id="tabs">
      <button data-tab="map" class="on"><svg class="i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="19" cy="5" r="2"/><circle cx="19" cy="19" r="2"/><path d="M7 12c5 0 5-7 10-7M7 12c5 0 5 7 10 7"/></svg>연결 지도</button>
      <button data-tab="board"><svg class="i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>협업 대시보드</button>
      <button data-tab="chat"><svg class="i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>메신저 <i id="unread" class="count"></i></button>
      <button data-tab="wiki"><svg class="i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>지식위키</button>
      <button data-tab="agent"><svg class="i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-1.8 5.41a2 2 0 0 1-1.27 1.27L7.76 16.24l1.8-5.41a2 2 0 0 1 1.27-1.27z"/></svg>AI 본부장</button>
    </nav>
    <div id="pane"></div>
  </section>
</div>

<div id="modal" class="modal hidden"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>

<script src="demo-data.js"></script>
<script src="app.js"></script>
</body>
</html>
